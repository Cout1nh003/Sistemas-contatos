<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | OrçaFlow</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-intro">
      <div class="brand-mark">OF</div>
      <p class="eyebrow">Gestão de contatos</p>
      <h1>Decisões melhores começam com bons dados.</h1>
      <p class="intro-copy">Centralize solicitações, acompanhe oportunidades e mantenha cada conversa no lugar certo.</p>
      <div class="login-stats"><span>01</span><span>Organizado</span><span>02</span><span>Seguro</span></div>
    </section>
    <section class="login-card" aria-labelledby="login-title">
      <div class="card-heading"><p class="eyebrow">Acesso administrativo</p><h2 id="login-title">Bem-vindo de volta</h2><p>Entre para acessar seu painel.</p></div>
      <div id="login-message" class="feedback" role="status" aria-live="polite"></div>
      <form id="login-form" novalidate>
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Digite seu usuário" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
        <button class="button button-primary button-full" type="submit">Entrar no painel <span aria-hidden="true">&#8594;</span></button>
      </form>
      <p class="login-hint">Acesso inicial: <strong>admin</strong> / <strong>1234</strong></p>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
